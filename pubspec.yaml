name: pixelsaz_pro
description: PixelSaz Pro - professional image converter, compressor and ID photo studio.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # App architecture and navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Image selection, capture, crop and conversion
  image_picker: ^1.2.4
  camera: ^0.12.2
  image_cropper: ^14.0.0
  heif_converter: ^1.0.7
  image: ^4.13.1

  # Files, gallery and sharing
  cross_file: ^0.3.5+5
  path_provider: ^2.1.6
  gal: ^3.0.1
  share_plus: ^13.3.1
  permission_handler: ^13.0.2

  # UI, typography, localization and settings
  google_fonts: ^8.2.1
  flutter_svg: ^2.5.0
  flutter_animate: ^4.5.2
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
