name: Build PixelSaz Pro Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate platform host project
        run: |
          flutter create --project-name pixelsaz_pro --org com.pixelsaz --platforms=android .
          rm -f test/widget_test.dart

      - name: Configure Android minSdk without downgrading Gradle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('android/app/build.gradle.kts')
          source = app.read_text()
          source = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', source)
          source = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 24', source)
          app.write_text(source)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run static analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelSaz-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
