name: Build PixelSaz Pro Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate platform host project
        run: flutter create --project-name pixelsaz_pro --org com.pixelsaz --platforms=android .

      - name: Upgrade Android Gradle and minSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings=Path('android/settings.gradle.kts')
          if settings.exists():
              s=settings.read_text()
              s=re.sub(r'id\("com.android.application"\) version "[^"]+"', 'id("com.android.application") version "8.12.1"', s)
              s=re.sub(r'id\("org.jetbrains.kotlin.android"\) version "[^"]+"', 'id("org.jetbrains.kotlin.android") version "2.2.0"', s)
              settings.write_text(s)
          gradle=Path('android/gradle/wrapper/gradle-wrapper.properties')
          if gradle.exists():
              s=gradle.read_text()
              s=re.sub(r'gradle-[0-9.]+-(?:all|bin)\.zip', 'gradle-8.13-all.zip', s)
              gradle.write_text(s)
          app=Path('android/app/build.gradle.kts')
          if app.exists():
              s=app.read_text()
              s=re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', s)
              s=re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 24', s)
              app.write_text(s)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run static analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelSaz-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
